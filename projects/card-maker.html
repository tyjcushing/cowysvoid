<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Excel Card Preview</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#222;
    color:white;
    margin:30px;
}

h1{
    margin-top:0;
}

textarea{
    width:100%;
    height:200px;
    font-family:Consolas,monospace;
    font-size:14px;
    padding:10px;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    padding:12px 25px;
    font-size:16px;
    cursor:pointer;
}

#cards{
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    width:250px;
    background:white;
    color:black;
    border-radius:12px;
    padding:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.card h2{
    margin:0;
    border-bottom:2px solid #ddd;
    padding-bottom:8px;
}

.field{
    margin-top:8px;
}

.label{
    font-weight:bold;
    color:#666;
}
</style>

</head>
<body>

<h1>Excel Card Generator</h1>

<p>
Copy cells directly from Excel and paste them below.
The first row should contain the column headers.
</p>

<textarea id="excelInput" placeholder="Paste Excel here..."></textarea>

<br>

<button onclick="generateCards()">
Generate Cards
</button>

<div id="cards"></div>

<script>

function generateCards(){

    const text = document.getElementById("excelInput").value.trim();

    if(text==""){
        alert("Paste some Excel data first.");
        return;
    }

    const rows = text.split(/\r?\n/);

    const headers = rows[0].split("\t");

    const cardsDiv = document.getElementById("cards");

    cardsDiv.innerHTML="";

    for(let i=1;i<rows.length;i++){

        if(rows[i].trim()=="")
            continue;

        const values = rows[i].split("\t");

        let html = "<div class='card'>";

        // Use first column as title
        html += `<h2>${values[0] || "Unnamed"}</h2>`;

        for(let j=1;j<headers.length;j++){

            html += `
            <div class="field">
                <div class="label">${headers[j]}</div>
                <div>${values[j] || ""}</div>
            </div>
            `;

        }

        html += "</div>";

        cardsDiv.innerHTML += html;

    }

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:30px;
    background:#2d2d2d;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;

}

h1{

    margin-top:0;

}

textarea{

    width:100%;
    height:180px;
    padding:10px;
    font-family:Consolas,monospace;
    font-size:14px;

}

button{

    margin-top:15px;
    padding:12px 24px;
    font-size:16px;
    cursor:pointer;

}

#cards{

    margin-top:30px;

    display:flex;
    flex-wrap:wrap;
    gap:20px;

}

.card{

    width:260px;
    height:390px;

    background:white;
    color:black;

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 6px 18px rgba(0,0,0,.35);

    display:flex;
    flex-direction:column;

}

.header{

    padding:15px;

}

.name{

    font-size:20px;
    font-weight:bold;

}

.subtitle{

    margin-top:4px;

    font-size:13px;

    color:#666;

}

.art{

    margin:0 15px;

    height:145px;

    border:2px dashed #bbb;

    border-radius:12px;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#999;

    font-size:18px;

    background:#f5f5f5;

}

.stats{

    margin-top:15px;

    display:flex;

    justify-content:space-evenly;

}

.stat{

    text-align:center;

}

.circle{

    width:56px;
    height:56px;

    border-radius:50%;

    background:#111;

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

    font-size:24px;

    font-weight:bold;

}

.label{

    margin-top:8px;

    font-size:12px;

    color:#555;

}

.ability{

    margin:18px;

    margin-top:20px;

    border-top:1px solid #ddd;

    padding-top:15px;

    line-height:1.4;

    font-size:15px;

    flex-grow:1;

}

</style>

</head>

<body>

<h1>Excel Card Builder</h1>

<p>Copy rows directly from Excel and paste below.</p>

<textarea id="input"></textarea>

<br>

<button onclick="generateCards()">
Generate Cards
</button>

<div id="cards"></div>

<script>

function generateCards(){

    const input=document.getElementById("input").value.trim();

    if(input=="")
        return;

    const rows=input.split(/\r?\n/);

    const headers=rows[0].split("\t");

    const cards=document.getElementById("cards");

    cards.innerHTML="";

    for(let r=1;r<rows.length;r++){

        const values=rows[r].split("\t");

        const name=values[0];

        if(!name || name.trim()=="")
            continue;

        const category=values[1] || "";
        const pillar=values[2] || "";
        const ability=values[3] || "";

        let stats="";

        for(let i=4;i<headers.length;i++){

            stats+=`

            <div class="stat">

                <div class="circle">

                    ${values[i] || 0}

                </div>

                <div class="label">

                    ${headers[i]}

                </div>

            </div>

            `;

        }

        cards.innerHTML+=`

        <div class="card">

            <div class="header">

                <div class="name">

                    ${name}

                </div>

                <div class="subtitle">

                    ${pillar} ${category}

                </div>

            </div>

            <div class="art">

                Artwork

            </div>

            <div class="stats">

                ${stats}

            </div>

            <div class="ability">

                ${ability}

            </div>

        </div>

        `;

    }

}

</script>

</body>
</html>
